<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mamo: tu plan de estudios de la FCEIA como un árbol que crece con lo que estudiás." />
    <meta name="theme-color" content="#fafbf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151a16" media="(prefers-color-scheme: dark)" />
    <!-- saved theme (see src/hooks/use-theme.ts), before the first paint -->
    <script>try{var t=localStorage.getItem('arbol.theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
    <title>Mamo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
