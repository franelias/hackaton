<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250" role="img" aria-labelledby="chart-title chart-desc">
  <style>
    text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #1d2a1f; }
    .t { font-size: 15px; font-weight: 600; }
    .s { font-size: 13px; fill: #5b6a5d; }
    .m { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .lbl { font-size: 13px; font-weight: 600; fill: #5b6a5d; }
    .step { fill: #ffffff; stroke: #c9d3c6; stroke-width: 1.5; }
    .core { fill: #e1f0e5; stroke: #2f7d4f; stroke-width: 2; }
    .ask { fill: #ffffff; stroke: #2f7d4f; stroke-width: 1.5; }
    .out { fill: #f6ead6; stroke: #8a5a1c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .stop { fill: #f7e1de; stroke: #a3392f; stroke-width: 1.5; }
    .end { fill: #2f7d4f; stroke: none; }
    .end-t { fill: #f6f7f2; font-size: 15px; font-weight: 600; }
    .end-s { fill: #f6f7f2; font-size: 13px; }
    .wire { fill: none; stroke: #8a978b; stroke-width: 1.75; }
    .ah { fill: #8a978b; }
  </style>
  <rect width="900" height="1250" fill="#f6f7f2"/>
      <title id="chart-title">Diagrama de flujo del armador de horarios</title>
      <desc id="chart-desc">Valida el pedido, filtra correlativas, arma comisiones, busca combinaciones sin superposiciones y elige las tres mejores. Si no hay ninguna, reintenta sin días libres y, si aún no hay, elige qué materias postergar y vuelve a buscar con el resto.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path class="ah" d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>

      <!-- Start -->
      <rect class="end" x="120" y="20" width="420" height="60" rx="30"/>
      <text class="end-t" x="330" y="46" text-anchor="middle">Pedido del alumno</text>
      <text class="end-s" x="330" y="66" text-anchor="middle">materias + aprobadas y regulares + turno y días libres</text>
      <path class="wire" d="M330,80 V112" marker-end="url(#arrow)"/>

      <!-- Validate -->
      <rect class="step" x="120" y="116" width="420" height="64" rx="10"/>
      <text class="t" x="330" y="142" text-anchor="middle">Validar el pedido</text>
      <text class="s" x="330" y="162" text-anchor="middle">de 1 a 12 materias, de una misma carrera</text>
      <path class="wire" d="M540,148 H596" marker-end="url(#arrow)"/>
      <text class="lbl" x="568" y="140" text-anchor="middle">inválido</text>
      <rect class="stop" x="600" y="116" width="270" height="64" rx="10"/>
      <text class="t" x="735" y="142" text-anchor="middle">Error al alumno</text>
      <text class="m" x="735" y="162" text-anchor="middle">400 invalid_argument</text>
      <path class="wire" d="M330,180 V208" marker-end="url(#arrow)"/>

      <!-- Prerequisites -->
      <rect class="step" x="120" y="212" width="420" height="64" rx="10"/>
      <text class="t" x="330" y="238" text-anchor="middle">Chequear correlativas</text>
      <text class="s" x="330" y="258" text-anchor="middle">con las materias aprobadas y regulares del alumno</text>
      <path class="wire" d="M540,244 H596" marker-end="url(#arrow)"/>
      <rect class="out" x="600" y="212" width="270" height="64" rx="10"/>
      <text class="t" x="735" y="238" text-anchor="middle">Todavía no puede cursarlas</text>
      <text class="m" x="735" y="258" text-anchor="middle">not_enabled</text>
      <path class="wire" d="M330,276 V304" marker-end="url(#arrow)"/>

      <!-- Commissions -->
      <rect class="step" x="120" y="308" width="420" height="64" rx="10"/>
      <text class="t" x="330" y="334" text-anchor="middle">Armar las comisiones de cada materia</text>
      <text class="s" x="330" y="354" text-anchor="middle">con los horarios del cuatrimestre vigente (FCEIA API)</text>
      <path class="wire" d="M540,340 H596" marker-end="url(#arrow)"/>
      <rect class="out" x="600" y="308" width="270" height="64" rx="10"/>
      <text class="t" x="735" y="334" text-anchor="middle">Sin horarios publicados</text>
      <text class="m" x="735" y="354" text-anchor="middle">without_schedule</text>
      <path class="wire" d="M330,372 V400" marker-end="url(#arrow)"/>

      <!-- Search -->
      <rect class="core" x="120" y="404" width="420" height="84" rx="10"/>
      <text class="t" x="330" y="432" text-anchor="middle">Buscar combinaciones sin superposiciones</text>
      <text class="s" x="330" y="454" text-anchor="middle">una comisión por materia; descarta las que tienen</text>
      <text class="s" x="330" y="472" text-anchor="middle">clases en los días libres pedidos</text>
      <path class="wire" d="M330,488 V516" marker-end="url(#arrow)"/>

      <!-- Rank -->
      <rect class="core" x="120" y="520" width="420" height="84" rx="10"/>
      <text class="t" x="330" y="548" text-anchor="middle">Quedarse con las 3 mejores</text>
      <text class="s" x="330" y="570" text-anchor="middle">menos clases fuera del turno → menos días en la</text>
      <text class="s" x="330" y="588" text-anchor="middle">facultad → menos horas libres entre clases</text>
      <path class="wire" d="M330,604 V632" marker-end="url(#arrow)"/>

      <!-- Any option? -->
      <polygon class="ask" points="330,636 460,696 330,756 200,696"/>
      <text class="t" x="330" y="692" text-anchor="middle">¿Hay al menos</text>
      <text class="t" x="330" y="712" text-anchor="middle">una opción?</text>
      <path class="wire" d="M460,696 H596" marker-end="url(#arrow)"/>
      <text class="lbl" x="528" y="688" text-anchor="middle">sí</text>
      <rect class="end" x="600" y="656" width="270" height="80" rx="40"/>
      <text class="end-t" x="735" y="690" text-anchor="middle">Hasta 3 horarios</text>
      <text class="end-s" x="735" y="710" text-anchor="middle">+ aviso de traslados entre sedes</text>
      <path class="wire" d="M330,756 V788" marker-end="url(#arrow)"/>
      <text class="lbl" x="344" y="778">no</text>

      <!-- Free days? -->
      <polygon class="ask" points="330,792 460,852 330,912 200,852"/>
      <text class="t" x="330" y="848" text-anchor="middle">¿Pidió días libres?</text>
      <text class="s" x="330" y="868" text-anchor="middle">(solo la primera vez)</text>
      <path class="wire" d="M460,852 H596" marker-end="url(#arrow)"/>
      <text class="lbl" x="528" y="844" text-anchor="middle">sí</text>
      <rect class="step" x="600" y="816" width="270" height="72" rx="10"/>
      <text class="t" x="735" y="846" text-anchor="middle">Buscar de nuevo</text>
      <text class="s" x="735" y="866" text-anchor="middle">sin respetar los días libres, y avisar</text>
      <path class="wire" d="M870,852 H886 V446 H544" marker-end="url(#arrow)"/>
      <path class="wire" d="M330,912 V944" marker-end="url(#arrow)"/>
      <text class="lbl" x="344" y="934">no</text>

      <!-- Postpone -->
      <rect class="step" x="120" y="948" width="420" height="96" rx="10"/>
      <text class="t" x="330" y="976" text-anchor="middle">Elegir qué materias postergar</text>
      <text class="s" x="330" y="998" text-anchor="middle">prueba todas las combinaciones de materias y elige la que</text>
      <text class="s" x="330" y="1016" text-anchor="middle">toca menos cuellos de botella → posterga menos materias</text>
      <text class="s" x="330" y="1034" text-anchor="middle">→ destraba menos de la carrera</text>
      <path class="wire" d="M330,1044 V1072" marker-end="url(#arrow)"/>

      <!-- Search again -->
      <rect class="core" x="120" y="1076" width="420" height="64" rx="10"/>
      <text class="t" x="330" y="1102" text-anchor="middle">Buscar y ordenar con las que quedan</text>
      <text class="s" x="330" y="1122" text-anchor="middle">mismos criterios que arriba</text>
      <path class="wire" d="M330,1140 V1168" marker-end="url(#arrow)"/>

      <!-- End -->
      <rect class="end" x="120" y="1172" width="420" height="64" rx="32"/>
      <text class="end-t" x="330" y="1199" text-anchor="middle">Horarios + materias a postergar</text>
      <text class="end-s" x="330" y="1219" text-anchor="middle">+ qué materias chocan, en qué día y hora</text>
    </svg>
